<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meu Perfil - PetHub</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fffaee; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 15px; background-color: #d4751e; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background-color: #b36217; }
        .btn-cancel { background-color: #0c2476; color: white; text-decoration: none; padding: 10px 15px; border-radius: 4px; display: inline-block; margin-right: 10px; }
        .btn-cancel:hover { background-color: #081a54; }
        .btn-delete { background-color: #d9534f; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; display: inline-block; float: right; }
        .btn-delete:hover { background-color: #c9302c; }
        .error { color: #d9534f; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Meu Perfil (Tutor)</h2>
        <a th:href="@{/tutor/dashboard}" class="btn-cancel">&laquo; Voltar</a>
    </div>

    <form th:action="@{/tutor/perfil/editar}" th:object="${tutorForm}" method="post">
        
        <div class="form-group">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" th:field="*{nome}" required/>
            <div class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro de nome</div>
        </div>

        <div class="form-group">
            <label for="cpf">CPF *</label>
            <input type="text" id="cpf" th:field="*{cpf}" required/>
            <div class="error" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}">Erro de cpf</div>
        </div>

        <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" th:field="*{email}" required/>
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Erro de email</div>
        </div>

        <div class="form-group">
            <label for="senha">Nova Senha (obrigatório para salvar) *</label>
            <input type="password" id="senha" th:field="*{senha}" required/>
            <div class="error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}">Erro de senha</div>
        </div>

        <div style="margin-top: 30px;">
            <button type="submit" class="btn">Atualizar Perfil</button>
        </div>
    </form>
    
    <hr style="margin-top: 30px; border: 0; border-top: 1px solid #eee;">
    <div style="margin-top: 20px;">
        <form th:action="@{/tutor/perfil/deletar}" method="post" onsubmit="return confirm('ATENÇÃO: Tem certeza que deseja deletar sua conta permanentemente?');">
            <button type="submit" class="btn-delete">Deletar Minha Conta</button>
        </form>
        <div style="clear: both;"></div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meu Perfil - PetHub</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container container--media">
    <div class="header">
        <h2>Meu perfil</h2>
        <a th:href="@{/tutor/dashboard}" class="link-voltar">&laquo; Voltar</a>
    </div>

    <form th:action="@{/tutor/perfil/editar}" th:object="${tutorForm}" method="post">
        <div class="form-group">
            <label for="nome">Nome completo *</label>
            <input type="text" id="nome" th:field="*{nome}" required maxlength="150"/>
            <div class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div class="form-group">
            <label for="cpf">CPF *</label>
            <input type="text" id="cpf" th:field="*{cpf}" required maxlength="11"
                   pattern="\d{11}" title="Digite os 11 dígitos do CPF, sem pontos ou traços"/>
            <div class="error" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
        </div>

        <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" th:field="*{email}" required/>
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="senha">Senha *</label>
            <input type="password" id="senha" th:field="*{senha}" required minlength="6"/>
            <span class="ajuda">Digite a senha que passará a valer a partir de agora.</span>
            <div class="error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
        </div>

        <div class="acoes">
            <button type="submit" class="btn">Atualizar perfil</button>
        </div>
    </form>

    <hr class="separador">

    <h3>Encerrar conta</h3>
    <p class="vazio">
        Apaga definitivamente o seu cadastro, os seus pets e todo o histórico clínico deles.
    </p>
    <form th:action="@{/tutor/perfil/deletar}" method="post"
          onsubmit="return confirm('Esta ação apaga a sua conta, os seus pets e todo o histórico clínico. Não há como desfazer. Deseja continuar?');">
        <button type="submit" class="btn btn--perigo">Excluir minha conta</button>
    </form>
</div>
</body>
</html>

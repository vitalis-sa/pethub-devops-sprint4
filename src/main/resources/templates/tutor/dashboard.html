<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meus Pets - PetHub</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Bem-vindo(a), <span th:text="${nome}">Tutor</span>!</h2>
        <div class="acoes">
            <a th:href="@{/tutor/lembretes}" class="btn btn--claro">
                Lembretes
                <span class="badge badge--azul" th:if="${pendentes > 0}" th:text="${pendentes}">0</span>
            </a>
            <a th:href="@{/tutor/perfil}" class="btn btn--azul">Meu perfil</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn--azul">Sair</button>
            </form>
        </div>
    </div>

    <h3>Meus pets</h3>

    <p th:if="${#lists.isEmpty(pets)}" class="vazio">
        Você ainda não possui nenhum pet cadastrado.
    </p>

    <div th:each="pet : ${pets}" class="card card--linha">
        <div>
            <a th:href="@{/tutor/pets/{id}(id=${pet.id})}" th:text="${pet.nome}">Nome do pet</a>
            &ndash; <span th:text="${pet.especie}">Espécie</span>
            <span th:if="${pet.raca != null}" th:text="'(' + ${pet.raca} + ')'"></span>
        </div>
    </div>

    <div class="acoes">
        <a th:href="@{/tutor/pets/novo}" class="btn">Cadastrar novo pet</a>
    </div>
</div>
</body>
</html>

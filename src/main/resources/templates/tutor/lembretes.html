<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meus Lembretes - PetHub</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Meus lembretes</h2>
        <a th:href="@{/tutor/dashboard}" class="link-voltar">&laquo; Voltar</a>
    </div>

    <p class="vazio">
        O PetHub cria estes lembretes sozinho: ao agendar uma consulta, ao pedir um
        exame, ao marcar a próxima dose de uma vacina e quando o coleiro detecta
        que o pet bebeu pouca água no dia.
    </p>

    <p th:if="${#lists.isEmpty(lembretes)}" class="vazio">
        Nenhum lembrete até o momento.
    </p>

    <div th:each="lembrete : ${lembretes}" class="card">
        <div class="card--linha">
            <div>
                <span class="badge" th:text="${lembrete.tipo}">TIPO</span>
                <span class="badge"
                      th:classappend="${lembrete.status.name() == 'PENDENTE'} ? 'badge--azul' : 'badge--cinza'"
                      th:text="${lembrete.status}">STATUS</span>
                <strong th:if="${lembrete.dataAgendada != null}"
                        th:text="' ' + ${#temporals.format(lembrete.dataAgendada, 'dd/MM/yyyy')}"></strong>
            </div>
            <form th:if="${lembrete.status.name() == 'PENDENTE'}"
                  th:action="@{/tutor/lembretes/{id}/visto(id=${lembrete.id})}" method="post">
                <button type="submit" class="btn">Marcar como visto</button>
            </form>
        </div>
        <p style="margin: 10px 0 0 0;" th:text="${lembrete.mensagem}">Mensagem</p>
        <span class="ajuda" th:if="${lembrete.nomePet != null}"
              th:text="'Pet: ' + ${lembrete.nomePet}"></span>
    </div>
</div>
</body>
</html>

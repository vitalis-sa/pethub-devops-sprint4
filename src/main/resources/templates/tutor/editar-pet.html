<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Pet - PetHub</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container container--media">
    <div class="header">
        <h2>Editar pet</h2>
        <a th:href="@{/tutor/pets/{id}(id=${petId})}" class="link-voltar">&laquo; Voltar</a>
    </div>

    <form th:action="@{/tutor/pets/{id}/editar(id=${petId})}" th:object="${petForm}" method="post">
        <div th:replace="~{fragments/campos :: camposDoPet}"></div>
        <div class="acoes">
            <button type="submit" class="btn">Salvar alterações</button>
            <a th:href="@{/tutor/pets/{id}(id=${petId})}" class="btn btn--azul">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Os campos do pet são os mesmos ao cadastrar e ao editar. Ficam aqui para que
  acrescentar um campo signifique mexer num arquivo só — antes eram duas cópias
  que precisavam ser mantidas idênticas na unha.
-->
<div th:fragment="camposDoPet">
    <div class="form-group">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" th:field="*{nome}" required maxlength="100"/>
        <div class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
    </div>

    <div class="form-group">
        <label for="especie">Espécie *</label>
        <input type="text" id="especie" th:field="*{especie}" required maxlength="50"
               placeholder="Ex: Cachorro, Gato"/>
        <div class="error" th:if="${#fields.hasErrors('especie')}" th:errors="*{especie}"></div>
    </div>

    <div class="form-group">
        <label for="raca">Raça</label>
        <input type="text" id="raca" th:field="*{raca}" maxlength="50"/>
        <div class="error" th:if="${#fields.hasErrors('raca')}" th:errors="*{raca}"></div>
    </div>

    <div class="form-group">
        <label for="idade">Idade (anos)</label>
        <input type="number" id="idade" th:field="*{idade}" min="0" max="40"/>
        <div class="error" th:if="${#fields.hasErrors('idade')}" th:errors="*{idade}"></div>
    </div>

    <div class="form-group">
        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" th:field="*{peso}" step="0.1" min="0.1" max="200"/>
        <div class="error" th:if="${#fields.hasErrors('peso')}" th:errors="*{peso}"></div>
    </div>

    <div class="form-group">
        <label for="genero">Gênero</label>
        <input type="text" id="genero" th:field="*{genero}" maxlength="20" placeholder="Ex: Macho, Fêmea"/>
        <div class="error" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}"></div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - PetHub</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="centralizada">
<div class="container container--estreita">
    <h2 style="text-align: center;">PetHub</h2>

    <div th:if="${param.error}" class="aviso aviso--erro">E-mail ou senha inválidos.</div>
    <div th:if="${param.logout}" class="aviso aviso--sucesso">Você saiu do sistema com sucesso.</div>
    <div th:if="${param.registered}" class="aviso aviso--sucesso">
        Cadastro realizado! Já pode entrar com o seu e-mail e senha.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">E-mail</label>
            <input type="email" id="username" name="username" required autofocus/>
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required/>
        </div>
        <button type="submit" class="btn btn--largo">Entrar</button>
    </form>

    <div style="margin-top: 20px; text-align: center;">
        <p>Ainda não tem conta?</p>
        <a th:href="@{/registrar/tutor}" class="link-voltar" style="margin-right: 15px;">Sou Tutor</a>
        <a th:href="@{/registrar/vet}" style="color: var(--azul); font-weight: bold; text-decoration: none;">Sou Veterinário</a>
    </div>
</div>
</body>
</html>

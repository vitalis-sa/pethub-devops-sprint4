<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Tutor - PetHub</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container container--estreita">
    <h2 style="text-align: center;">Cadastro de Tutor</h2>

    <form th:action="@{/registrar/tutor}" th:object="${tutorForm}" method="post">
        <div class="form-group">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" th:field="*{nome}" required maxlength="150" autofocus/>
            <div class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div class="form-group">
            <label for="cpf">CPF (apenas números)</label>
            <input type="text" id="cpf" th:field="*{cpf}" required maxlength="11"
                   pattern="\d{11}" title="Digite os 11 dígitos do CPF, sem pontos ou traços"/>
            <div class="error" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
        </div>

        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" th:field="*{email}" required/>
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" th:field="*{senha}" required minlength="6"/>
            <span class="ajuda">Ao menos 6 caracteres.</span>
            <div class="error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
        </div>

        <button type="submit" class="btn btn--largo">Cadastrar</button>
        <a th:href="@{/login}" class="link-rodape">Já tem uma conta? Faça login</a>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Veterinário - PetHub</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container container--estreita">
    <h2 style="text-align: center;">Cadastro de Veterinário</h2>

    <form th:action="@{/registrar/vet}" th:object="${vetForm}" method="post">
        <div class="form-group">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" th:field="*{nome}" required maxlength="150" autofocus/>
            <div class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div class="form-group">
            <label for="crmv">CRMV</label>
            <input type="text" id="crmv" th:field="*{crmv}" required placeholder="Ex: SP-12345"/>
            <span class="ajuda">O registro profissional não pode ser alterado depois do cadastro.</span>
            <div class="error" th:if="${#fields.hasErrors('crmv')}" th:errors="*{crmv}"></div>
        </div>

        <div class="form-group">
            <label for="especialidade">Especialidade</label>
            <input type="text" id="especialidade" th:field="*{especialidade}" placeholder="Ex: Clínica geral"/>
            <div class="error" th:if="${#fields.hasErrors('especialidade')}" th:errors="*{especialidade}"></div>
        </div>

        <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" th:field="*{telefone}" placeholder="Ex: 11999998888"/>
            <div class="error" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
        </div>

        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" th:field="*{email}" required/>
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" th:field="*{senha}" required minlength="6"/>
            <span class="ajuda">Ao menos 6 caracteres.</span>
            <div class="error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
        </div>

        <button type="submit" class="btn btn--largo">Cadastrar</button>
        <a th:href="@{/login}" class="link-rodape">Já tem uma conta? Faça login</a>
    </form>
</div>
</body>
</html>

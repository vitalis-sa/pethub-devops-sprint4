<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agendar Consulta - PetHub Vet</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container container--media">
    <div class="header">
        <h2>Agendar nova consulta</h2>
        <a th:href="@{/vet/dashboard}" class="link-voltar">&laquo; Voltar</a>
    </div>

    <form th:action="@{/vet/consultas/nova}" th:object="${consultaForm}" method="post">
        <div class="form-group">
            <label for="petId">Paciente *</label>
            <select id="petId" th:field="*{petId}" required>
                <option value="">-- Selecione o pet --</option>
                <option th:each="pet : ${pets}" th:value="${pet.id}"
                        th:text="${pet.nome + ' (' + pet.especie + ')'}"></option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('petId')}" th:errors="*{petId}"></div>
        </div>

        <div class="form-group">
            <label for="dataHora">Data e hora *</label>
            <input type="datetime-local" id="dataHora" th:field="*{dataHora}" required/>
            <span class="ajuda">Um veterinário não pode ter duas consultas no mesmo horário.</span>
            <div class="error" th:if="${#fields.hasErrors('dataHora')}" th:errors="*{dataHora}"></div>
        </div>

        <div class="form-group">
            <label for="tipo">Tipo de consulta *</label>
            <select id="tipo" th:field="*{tipo}" required>
                <option value="">-- Selecione --</option>
                <option th:each="t : ${tiposConsulta}" th:value="${t}" th:text="${t}"></option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
        </div>

        <div class="form-group">
            <label for="motivo">Motivo</label>
            <input type="text" id="motivo" th:field="*{motivo}" maxlength="255"
                   placeholder="Ex: Vacinação, check-up"/>
            <div class="error" th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}"></div>
        </div>

        <div class="acoes">
            <button type="submit" class="btn">Agendar consulta</button>
            <a th:href="@{/vet/dashboard}" class="btn btn--azul">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>

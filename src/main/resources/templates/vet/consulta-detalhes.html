<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prontuário da Consulta - PetHub Vet</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container container--media">
    <div class="header">
        <h2>Consulta de <span th:text="${#temporals.format(consulta.dataHora, 'dd/MM/yyyy HH:mm')}"></span></h2>
        <a th:href="@{/vet/dashboard}" class="link-voltar">&laquo; Voltar</a>
    </div>

    <div class="info-card info-card--azul">
        <strong>Pet:</strong> <span th:text="${consulta.nomePet}"></span><br>
        <strong>Motivo:</strong> <span th:text="${consulta.observacoes ?: '—'}"></span><br>
        <strong>Status:</strong> <span th:text="${consulta.status}"></span>
    </div>

    <div th:if="${consulta.status.name() == 'REALIZADA'}" class="aviso aviso--sucesso">
        O prontuário desta consulta já foi registrado.
    </div>

    <form th:if="${consulta.status.name() != 'REALIZADA'}"
          th:action="@{/vet/consultas/{id}/prontuario(id=${consulta.id})}"
          th:object="${prontuarioForm}" method="post">

        <div class="aviso aviso--erro" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}" style="margin:0;"></p>
        </div>

        <div class="form-section">
            <h3>1. Diagnóstico</h3>
            <div class="form-group">
                <label for="sintoma1">Sintoma principal *</label>
                <input type="text" id="sintoma1" th:field="*{sintoma1}" required maxlength="255"
                       placeholder="Ex: Febre, letargia"/>
                <div class="error" th:if="${#fields.hasErrors('sintoma1')}" th:errors="*{sintoma1}"></div>
            </div>
            <div class="form-group">
                <label for="doencaPredita">Doença suspeita</label>
                <input type="text" id="doencaPredita" th:field="*{doencaPredita}" maxlength="255"
                       placeholder="Ex: Parvovirose"/>
                <div class="error" th:if="${#fields.hasErrors('doencaPredita')}" th:errors="*{doencaPredita}"></div>
            </div>
        </div>

        <div class="form-section">
            <h3>2. Pedido médico (opcional)</h3>
            <div class="form-group">
                <label for="tipo">Tipo</label>
                <select id="tipo" th:field="*{tipo}">
                    <option value="">-- Não solicitar nada --</option>
                    <option th:each="t : ${tiposPedido}" th:value="${t}" th:text="${t}"></option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
            </div>
            <div class="form-group">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" th:field="*{descricao}" maxlength="255"
                       placeholder="Ex: Hemograma completo"/>
                <span class="ajuda">Tipo e descrição andam juntos: preencha os dois ou nenhum.</span>
                <div class="error" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
            </div>
            <div class="form-group">
                <label for="instrucoes">Instruções</label>
                <textarea id="instrucoes" th:field="*{instrucoes}" rows="3" maxlength="255"
                          placeholder="Ex: Jejum de 8h"></textarea>
                <div class="error" th:if="${#fields.hasErrors('instrucoes')}" th:errors="*{instrucoes}"></div>
            </div>
        </div>

        <button type="submit" class="btn btn--largo">Registrar prontuário e concluir consulta</button>
    </form>
</div>
</body>
</html>

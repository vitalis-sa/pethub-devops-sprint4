<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Minha Agenda - PetHub Vet</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Painel do veterinário: <span th:text="${nome}">Vet</span></h2>
        <div class="acoes">
            <a th:href="@{/vet/perfil}" class="btn btn--azul">Meu perfil</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn--azul">Sair</button>
            </form>
        </div>
    </div>

    <h3>Minhas consultas</h3>

    <p th:if="${#lists.isEmpty(consultas)}" class="vazio">
        Você não possui nenhuma consulta no momento.
    </p>

    <div th:each="consulta : ${consultas}" class="card">
        <div class="card--linha">
            <a th:href="@{/vet/consultas/{id}(id=${consulta.id})}">
                Consulta de <span th:text="${#temporals.format(consulta.dataHora, 'dd/MM/yyyy HH:mm')}"></span>
            </a>
            <span class="badge"
                  th:classappend="${consulta.status.name() == 'REALIZADA'} ? 'badge--verde' : ''"
                  th:text="${consulta.status}">STATUS</span>
        </div>
        <p style="margin: 8px 0 0 0; color: #555;">
            <strong>Pet:</strong> <span th:text="${consulta.nomePet}"></span> &middot;
            <strong>Motivo:</strong> <span th:text="${consulta.observacoes ?: '—'}"></span>
        </p>
    </div>

    <div class="acoes">
        <a th:href="@{/vet/consultas/nova}" class="btn">Agendar nova consulta</a>
    </div>
</div>
</body>
</html>
